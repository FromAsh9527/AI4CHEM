# Suzuki continuation-arm experiment: topk init + warm continuation options
# 120 jobs = 12 targets x 2 new arms (warmtop5, warmall) x 5 seeds
# Arms A (topk_warm) and D (topk_random_post) use existing results.
db: data/db/transferbo2_suzuki.db
experiment_id: suzuki_continuation_arms
n_init: 5
budget: 20
seeds: [0, 1, 2, 3, 4]
acquisition: ei
topk: 5
max_warm_points: 120
use_plate_correction: false
rule: mean
target_substrates: null
strategies:
  - topk_warm_warmtop5
  - topk_warm_warmall
out_dir: results/suzuki_continuation_arms
