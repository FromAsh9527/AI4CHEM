# Step1b Phase A — amination FULL for HPC (5 seeds, align Step1 scale)
# Condition OHE; substrate morgan_r2 + Tanimoto. RDKit not needed at runtime (DB has vectors).

db: data/db/transferbo2.db
experiment_id: amination_rep_A_morgan_sub_hpc

substrate_descriptor: morgan_r2
condition_features: ohe
similarity_metric: tanimoto

n_init: 5
budget: 20
seeds: [0, 1, 2, 3, 4]
acquisition: ei
topk: 5
max_warm_points: 100
warm_strength: 0.5
lengthscale_sub: 1.0
gate_spearman_min: 0.15
gate_sim_min: 0.15
use_plate_correction: false

strategies:
  - random
  - cold_start
  - topk_warm
  - nearest_topk_warm
  - sim_weighted
  - safe_gate

# 450 = 15 × 6 × 5
out_dir: results/amination_rep_A_morgan_sub_full
