# Step1b Phase B pilot — condition DFT + substrate Morgan (amination)
# Run only after Phase A pilot is readable. Do not mix with OHE claims.

db: data/db/transferbo2.db
experiment_id: amination_rep_B_dft_cond_pilot

substrate_descriptor: morgan_r2
condition_features: dft
dft_csv: ../TransferBO/data/descriptors/edbo_amination_condition_dft.csv
similarity_metric: tanimoto

n_init: 5
budget: 20
seeds: [0, 1, 2]
acquisition: ei
topk: 5
max_warm_points: 100
warm_strength: 0.5
lengthscale_sub: 1.0
gate_spearman_min: 0.15
gate_sim_min: 0.15
use_plate_correction: false

target_substrates:
  - sub_s4
  - sub_s1
  - sub_s7

strategies:
  - random
  - cold_start
  - topk_warm
  - nearest_topk_warm
  - sim_weighted
  - safe_gate

out_dir: results/amination_rep_B_dft_cond_pilot
