[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transferbo2"
version = "0.1.0"
description = "Plate-aware, substrate-aware transfer Bayesian optimisation for reaction HTE"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AI4CHEM" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "seaborn>=0.13",
]

[project.optional-dependencies]
chem = ["rdkit>=2023.9.1"]
botorch = ["torch>=2.0", "gpytorch>=1.11", "botorch>=0.9"]
dev = ["pytest>=7.4", "ipykernel>=6.25"]
all = ["transferbo2[chem,botorch,dev]"]

[project.scripts]
tbo2-init-db = "transferbo2.cli:init_db_main"
tbo2-demo = "transferbo2.cli:demo_main"
tbo2-run = "transferbo2.cli:run_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
