[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transferbo"
version = "0.1.0"
description = "Cross-plate transfer / warm-start Bayesian optimisation on public HTE additive-screening data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AI4CHEM" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "rdkit>=2023.9.1",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "seaborn>=0.13",
]

[project.optional-dependencies]
botorch = ["torch>=2.0", "gpytorch>=1.11", "botorch>=0.9"]
drfp = ["drfp>=0.3"]
dev = ["pytest>=7.4", "ipykernel>=6.25"]
all = ["transferbo[botorch,drfp,dev]"]

[project.scripts]
transferbo-prepare = "scripts.prepare_data:main"
transferbo-run = "scripts.run_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
