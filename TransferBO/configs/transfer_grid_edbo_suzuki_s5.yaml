# W9 / S5 — init-only transfer (source ranking → target init; no persistent labels)
# Compare: cold_start vs init_only_warm vs label_warm (A1) under same budget.

experiment:
  name: edbo_suzuki_s5
  output_dir: results/external_edbo_suzuki_s5

data:
  processed_path: data/processed/edbo_suzuki_plates.csv
  response_col: response
  smiles_col: smiles
  plate_col: plate_id
  id_col: additive_id

grid:
  strategies: [cold_start, init_only_warm, label_warm]
  representations: [morgan, dft]
  plates: [suz_t1, suz_t9]
  include_same_plate: false

representation:
  name: morgan
  morgan:
    radius: 2
    n_bits: 2048
  dft:
    table_path: data/descriptors/edbo_suzuki_condition_dft.csv
    smiles_col: smiles
    standardize: true

strategy:
  name: init_only_warm
  n_init: 20
  batch_size: 1
  init_mode: random

bo:
  budget: 100
  acquisition: ei
  normalize_y: true
  backend: sklearn

transfer:
  source_fraction: 1.0
  max_warm_points: 150

seeds: [0]

metrics:
  top_fracs: [0.01, 0.05]
  save_curves: true
