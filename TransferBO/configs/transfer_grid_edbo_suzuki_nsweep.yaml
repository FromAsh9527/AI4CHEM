# W7 / P1.2 — source label count sensitivity (max_warm_points)
# Pilot: Morgan + DFT × A0/A1 × S0 matched init; expand seeds after pilot.
# max_warm_points values: 20, 50, 100, 0(=full / uncapped)
# Runner: scripts/run_nsweep_pilot.py

experiment:
  name: edbo_suzuki_nsweep
  output_dir: results/external_edbo_suzuki_nsweep

data:
  processed_path: data/processed/edbo_suzuki_plates.csv
  response_col: response
  smiles_col: smiles
  plate_col: plate_id
  id_col: additive_id

grid:
  strategies: [cold_start, label_warm]
  representations: [morgan, dft]
  # local pilot plates; expand to full 8-task set + seeds 0..19 for production
  plates: [suz_t1, suz_t9]
  include_same_plate: false

representation:
  name: morgan
  morgan:
    radius: 2
    n_bits: 2048
  dft:
    table_path: data/descriptors/edbo_suzuki_condition_dft.csv
    smiles_col: smiles
    standardize: true

strategy:
  name: label_warm
  n_init: 20
  batch_size: 1
  init_mode: random

bo:
  budget: 100
  acquisition: ei
  normalize_y: true
  backend: sklearn

transfer:
  source_fraction: 1.0
  max_warm_points: 150

nsweep:
  max_warm_points: [20, 50, 100, 0]
  note: "0 means uncapped (full source after source_fraction)"

# local pilot seeds; production: 0..19
seeds: [0]

metrics:
  top_fracs: [0.01, 0.05]
  save_curves: true
