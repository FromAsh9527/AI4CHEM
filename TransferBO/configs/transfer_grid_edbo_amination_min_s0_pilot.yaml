# W8 pilot — amination min S0 (small seeds/plates for local smoke + early signal)
# Full grid remains configs/transfer_grid_edbo_amination_min_s0.yaml (HPC).

experiment:
  name: edbo_amination_min_s0_pilot
  output_dir: results/external_edbo_amination_min_s0_pilot

data:
  processed_path: data/processed/edbo_amination_plates.csv
  response_col: response
  smiles_col: smiles
  plate_col: plate_id
  id_col: additive_id

grid:
  strategies: [cold_start, label_warm]
  representations: [morgan, dft]
  plates: [sub_s1, sub_s2]
  include_same_plate: false

representation:
  name: morgan
  morgan:
    radius: 2
    n_bits: 2048
  dft:
    table_path: data/descriptors/edbo_amination_condition_dft.csv
    smiles_col: smiles
    standardize: true

strategy:
  name: label_warm
  n_init: 20
  batch_size: 1
  init_mode: random

bo:
  budget: 100
  acquisition: ei
  normalize_y: true
  backend: sklearn

transfer:
  source_fraction: 1.0
  max_warm_points: 150

seeds: [0]

metrics:
  top_fracs: [0.01, 0.05]
  save_curves: true
